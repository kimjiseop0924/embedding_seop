<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 문맥 & 관계도 분석기</title>
    <style>
        :root { --bg: #0a0a0c; --surface: #131318; --accent: #7c6aef; --text: #e8e6f0; --green: #50d080; --red: #f87171; }
        body { background: var(--bg); color: var(--text); font-family: 'Malgun Gothic', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        header { text-align: center; margin-bottom: 2rem; }
        
        .input-group { background: var(--surface); padding: 20px; border-radius: 15px; border: 1px solid #1e1e26; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0a0a0c; border: 1px solid #333; color: white; border-radius: 8px; }
        .btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        /* 관계도 그래프 영역 */
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .model-card { background: var(--surface); border: 1px solid #1e1e26; padding: 15px; border-radius: 12px; }
        .score-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .bar-bg { flex: 1; height: 8px; background: #1e1e26; border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.8s ease-out; }

        /* 의미 분석 결과창 */
        .analysis-box { margin-top: 25px; padding: 20px; background: #1e1e26; border-radius: 15px; border-left: 5px solid var(--accent); display: none; }
        .highlight { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
