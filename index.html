<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI | 다의어 정밀 분석기</title>
    <style>
        :root {
            --bg: #050507; --card: #0f111a; --accent: #7c6aef;
            --text: #ffffff; --dim: #94a3b8; --green: #10b981; --red: #f87171;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; }
        
        .glass-card { background: var(--card); border: 1px solid #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }

        .result-area { display: none; margin-top: 20px; }
        .meaning-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .meaning-item { background: #161b22; padding: 20px; border-radius: 15px; border-left: 4px solid var(--accent); }
        
        .score-card { background: #161b22; padding: 25px; border-radius: 20px; text-align: center; border: 1px solid #30363d; }
        .graph-bar { width: 100%; height: 12px; background: #333; border-radius: 6px; margin: 15px 0; overflow: hidden; }
        .fill { height: 100%; width: 0%; background: var(--accent); transition: width 1s ease-in-out; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom:30px;">
        <h1 style="color:var(--accent);">Word Meaning AI</h1>
        <p style="color:var(--dim);">다의어의 정확한 뜻과 관계도를 분석합니다</p>
    </header>

    <div class="glass-card">
        <input type="text" id="sent1" value="시원한 배를 깎아서 후식으로 먹었다">
        <input type="text" id="sent2" value="배를 타고 푸른 바다를 건너갔다">
        <button id="runBtn" class="btn" disabled>AI 분석 모델 준비 중...</button>
    </div>

    <div id="resultArea" class="result-area">
        <div class="meaning-grid">
            <div class="meaning-item">
                <div style="font-size:0.8rem; color:var(--accent); font-weight:bold;">SENTENCE 1 MEANING</div>
                <div id="type1" style="font-size:1.1rem; margin-top:5px; font-weight:bold;">--</div>
            </div>
            <div class="meaning-item">
                <div style="font-size:0.8rem; color:var(--accent); font-weight:bold;">SENTENCE 2 MEANING</div>
                <div id="type2" style="font-size:1.1rem; margin-top:5px; font-weight:bold;">--</div>
            </div>
        </div>

        <div class="score-card">
            <div style="font-size:0.9rem; color:var(--dim);">AI가 판단한 관계도</div>
            <div id="scoreText" style="font-size:3rem; font-weight:800; color:var(--accent);">0%</div>
            <div class="graph-bar"><div id="barFill" class="fill"></div></div>
            <p id="verdict" style="font-weight:bold;"></p>
        </div>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let extractor;
    const runBtn = document.getElementById('runBtn');

    async function init() {
        // 문장 내 단어 관계를 가장 잘 이해하는 다국어 모델 로딩
        extractor = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
        runBtn.disabled = false;
        runBtn.textContent = "문맥 정밀 분석 실행";
    }

    function cosineSim(a, b) {
        let dot = 0, nA = 0, nB = 0;
        for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; nA += a[i] * a[i]; nB += b[i] * b[i]; }
        return dot / (Math.sqrt(nA) * Math.sqrt(nB));
    }

    // [중요] 단어 주변의 힌트를 통해 의미를 정의하는 로직
    function detectMeaning(text) {
        const dictionary = [
            { category: "🍎 먹는 과일 (음식)", keywords: ["먹", "맛", "깎", "즙", "달콤", "과일", "후식", "사오", "씻"] },
            { category: "🚢 타는 배 (운송 수단)", keywords: ["타", "항구", "바다", "갑판", "선장", "파도", "선박", "출항"] },
            { category: "🧍 신체 부위 (사람 몸)", keywords: ["아프", "배탈", "복통", "부르", "홀쭉", "배꼽", "병원", "만지"] }
        ];

        for (const item of dictionary) {
            if (item.keywords.some(k => text.includes(k))) return item.category;
        }
        return "❓ 기타 문맥";
    }

    runBtn.onclick = async () => {
        const s1 = document.getElementById('sent1').value;
        const s2 = document.getElementById('sent2').value;
        runBtn.disabled = true;

        const out1 = await extractor(s1, { pooling: 'mean', normalize: true });
        const out2 = await extractor(s2, { pooling: 'mean', normalize: true });
        
        let sim = cosineSim(out1.data, out2.data);
        
        const m1 = detectMeaning(s1);
        const m2 = detectMeaning(s2);

        // 만약 의미 카테고리가 다르면 인위적으로 관계도 점수를 조정하여 정확도를 높임
        if (m1 !== m2 && m1 !== "❓ 기타 문맥" && m2 !== "❓ 기타 문맥") {
            sim = sim * 0.4; // 의미가 다르면 점수를 확 낮춤
        }

        const score = (sim * 100).toFixed(1);

        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('type1').textContent = m1;
        document.getElementById('type2').textContent = m2;
        document.getElementById('scoreText').textContent = score + "%";
        document.getElementById('barFill').style.width = score + "%";

        const verdict = document.getElementById('verdict');
        if (sim < 0.4) {
            verdict.textContent = "의미가 전혀 다른 문장입니다.";
            verdict.style.color = "var(--red)";
            document.getElementById('barFill').style.background = "var(--red)";
        } else {
            verdict.textContent = "의미가 서로 통하는 문장입니다.";
            verdict.style.color = "var(--green)";
            document.getElementById('barFill').style.background = "var(--accent)";
        }

        runBtn.disabled = false;
    };

    init();
</script>
</body>
</html>
