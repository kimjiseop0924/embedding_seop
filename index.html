<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 문장 분석 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --main-color: #6c5ce7; --bg-color: #f0f2f5; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { max-width: 1000px; width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .full-width { grid-column: 1 / 3; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 12px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--main-color); outline: none; }
        .btn { width: 100%; padding: 15px; background: var(--main-color); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #5849c4; transform: translateY(-2px); }
        h3 { margin-top: 0; color: #2d3436; }
        .chart-container { position: relative; height: 250px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card full-width">
        <h3>🔍 문장 비교 분석기</h3>
        <input type="text" id="s1" placeholder="첫 번째 문장을 입력하세요 (예: 배를 타고 바다를 건넌다)">
        <input type="text" id="s2" placeholder="두 번째 문장을 입력하세요 (예: 항구에 큰 배가 들어온다)">
        <button id="analyzeBtn" class="btn">정밀 분석 실행</button>
    </div>

    <div class="card">
        <h3>🎯 종합 유사도 점수</h3>
        <div class="chart-container">
            <canvas id="gaugeChart"></canvas>
        </div>
        <p id="scoreText" style="text-align:center; font-size: 24px; font-weight: bold; margin-top: 10px; color: var(--main-color);">0%</p>
    </div>

    <div class="card">
        <h3>📊 문맥 구성 요소 비교</h3>
        <div class="chart-container">
            <canvas id="radarChart"></canvas>
        </div>
    </div>
</div>

<script>
    let gaugeChart, radarChart;

    // 분석 버튼 클릭 이벤트
    document.getElementById('analyzeBtn').onclick = function() {
        const text1 = document.getElementById('s1').value;
        const text2 = document.getElementById('s2').value;

        if(!text1 || !text2) return alert("두 문장을 모두 입력해주세요!");

        // 1. 유사도 계산 로직 (중학생 수준의 간단한 단어 매칭)
        const words1 = text1.split(' ');
        const words2 = text2.split(' ');
        
        let matchCount = 0;
        words1.forEach(w => { if(text2.includes(w)) matchCount++; });

        // 2. 가상의 머신러닝 분석 데이터 생성 (시각화를 위해)
        let baseScore = (matchCount / Math.max(words1.length, words2.length)) * 100;
        if (baseScore > 100) baseScore = 100;

        // 결과 업데이트
        updateCharts(baseScore.toFixed(1));
    };

    function updateCharts(score) {
        // 기존 차트 삭제
        if(gaugeChart) gaugeChart.destroy();
        if(radarChart) radarChart.destroy();

        document.getElementById('scoreText').innerText = score + "%";

        // 종합 점수 도넛 차트
        gaugeChart = new Chart(document.getElementById('gaugeChart'), {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: [score, 100 - score],
                    backgroundColor: ['#6c5ce7', '#dfe6e9'],
                    borderWidth: 0,
                    circumference: 180,
                    rotation: 270
                }]
            },
            options: { cutout: '80%', plugins: { legend: { display: false } } }
        });

        // 레이더 차트 (가상의 특징 분석)
        radarChart = new Chart(document.getElementById('radarChart'), {
            type: 'radar',
            data: {
                labels: ['어휘 일치', '문법 구조', '문맥 분위기', '핵심 주어', '길이 유사도'],
                datasets: [{
                    label: '문장 일치 지표',
                    data: [score, 70, score * 0.8, 90, 100 - Math.abs(score-50)],
                    borderColor: '#00b894',
                    backgroundColor: 'rgba(0, 184, 148, 0.2)',
                    pointBackgroundColor: '#00b894'
                }]
            },
            options: { scales: { r: { suggestMin: 0, suggestMax: 100, ticks: { display: false } } } }
        });
    }
</script>
</body>
</html>
