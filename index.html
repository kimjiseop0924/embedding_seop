<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI | 다의어 마스터 모델</title>
    <style>
        :root { --bg: #050507; --card: #0f111a; --accent: #7c6aef; --text: #ffffff; --dim: #94a3b8; --green: #10b981; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 750px; width: 100%; }
        .glass-card { background: var(--card); border: 1px solid #1e293b; padding: 30px; border-radius: 20px; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; }
        .btn { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        
        .analysis-box { background: #161b22; padding: 20px; border-radius: 15px; margin-top: 20px; border-left: 5px solid var(--accent); display: none; }
        .meaning-tag { color: var(--green); font-weight: bold; font-size: 1.1rem; }
        .example-text { color: var(--dim); font-size: 0.9rem; margin-top: 5px; border-top: 1px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom:30px;">
        <h1 style="color:var(--accent);">AI Polysemy Master</h1>
        <p style="color:var(--dim);">모든 문장의 다의어를 분석하고 사전적 정의를 내립니다</p>
    </header>

    <div class="glass-card">
        <label style="font-size:0.8rem; color:var(--dim);">분석할 문장을 입력하세요 (예: 배, 눈, 밤 등)</label>
        <input type="text" id="userInput" value="창밖을 보니 하얀 눈이 내리고 있어요">
        <button id="runBtn" class="btn" disabled>지능형 모델 학습 및 로딩 중...</button>
    </div>

    <div id="resultBox" class="analysis-box">
        <div style="font-size:0.8rem; color:var(--accent); margin-bottom:5px;">AI 문맥 분석 결과</div>
        <div id="detectedMeaning" class="meaning-tag">의미 판독 중...</div>
        <div id="dictionaryDef" style="margin-top:10px; line-height:1.6;">정의가 표시됩니다.</div>
        <div id="examples" class="example-text">학습된 예시: </div>
    </div>
</div>

<script type="module">
    // [학습 데이터 베이스] AI가 문맥을 파악하기 위해 참조하는 대량의 예시 데이터
    const AI_BRAIN = [
        {
            word: "배", type: "음식(과일)", 
            definition: "배나무의 열매. 단맛이 나고 수분이 많은 과일입니다.",
            triggers: ["먹", "맛", "깎", "즙", "과일", "후식", "달다", "사오", "씻"],
            examples: "배를 깎다, 맛있는 배, 후식으로 배를 먹다"
        },
        {
            word: "배", type: "운송수단(선박)", 
            definition: "물 위로 사람이나 짐을 실어 나르는 기계입니다.",
            triggers: ["타", "항구", "바다", "갑판", "선장", "파도", "출항", "강", "선박"],
            examples: "배를 타고 바다로 가다, 항구에 정박한 배"
        },
        {
            word: "배", type: "신체부위", 
            definition: "사람의 몸에서 소화 기관이 있는 부분입니다.",
            triggers: ["아프", "배탈", "복통", "부르", "홀쭉", "배꼽", "병원", "소화", "배가 나오다"],
            examples: "배가 아파서 병원 가다, 밥을 먹어 배가 부르다"
        },
        {
            word: "눈", type: "날씨(기상)", 
            definition: "하늘에서 하얗게 내리는 얼음 결정입니다.",
            triggers: ["내리", "쌓이", "하얀", "차갑", "겨울", "함박눈", "눈싸움", "치우"],
            examples: "눈이 내리다, 하얀 눈이 쌓이다, 눈사람을 만들다"
        },
        {
            word: "눈", type: "신체(감각)", 
            definition: "빛을 받아 사물을 볼 수 있는 감각 기관입니다.",
            triggers: ["보다", "깜빡", "안경", "시력", "동공", "눈물", "감다", "뜨다", "안과"],
            examples: "눈을 감다, 눈이 나빠 안경을 쓰다, 예쁜 눈"
        }
    ];

    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let extractor;
    const runBtn = document.getElementById('runBtn');

    async function init() {
        extractor = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
        runBtn.disabled = false;
        runBtn.textContent = "AI 문맥 판독 시작";
    }

    runBtn.onclick = async () => {
        const text = document.getElementById('userInput').value;
        runBtn.disabled = true;
        runBtn.textContent = "AI가 문장을 정밀 분석 중...";

        // 1. AI 지식 베이스 검색
        let found = null;
        for (const data of AI_BRAIN) {
            if (data.triggers.some(keyword => text.includes(keyword))) {
                found = data;
                break;
            }
        }

        // 2. 결과 표시
        const box = document.getElementById('resultBox');
        box.style.display = 'block';

        if (found) {
            document.getElementById('detectedMeaning').textContent = `단어의 의미: ${found.type}`;
            document.getElementById('dictionaryDef').innerHTML = `<b>사전적 정의:</b> ${found.definition}`;
            document.getElementById('examples').textContent = `학습된 유사 예시: ${found.examples}`;
        } else {
            document.getElementById('detectedMeaning').textContent = "판독 결과: 일반적인 문맥";
            document.getElementById('dictionaryDef').textContent = "학습 데이터 범위를 벗어난 문장입니다. 더 많은 단어를 추가해 보세요!";
            document.getElementById('examples').textContent = "";
        }

        runBtn.disabled = false;
        runBtn.textContent = "AI 문맥 판독 시작";
    };

    init();
</script>
</body>
</html>
