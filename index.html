<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI | Context Relation Analyzer</title>
    <style>
        :root {
            --bg: #050507; --card: #0f111a; --accent: #7c6aef;
            --text: #ffffff; --dim: #94a3b8; --green: #10b981; --red: #f87171;
        }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; }
        
        /* 입력 섹션 */
        .glass-card { background: var(--card); border: 1px solid #1e293b; padding: 30px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 1rem; }
        .btn { width: 100%; padding: 16px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover:not(:disabled) { background: #6a59d1; transform: translateY(-2px); }

        /* 결과 섹션 */
        .result-area { display: none; animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .relation-card { background: #161b22; border-radius: 20px; padding: 25px; border: 1px solid #30363d; margin-bottom: 20px; text-align: center; }
        .score-display { font-size: 3rem; font-weight: 800; color: var(--accent); margin: 10px 0; }
        
        /* 관계도 그래프 */
        .graph-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin: 20px 0; }
        .graph-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), #a78bfa); transition: width 1s cubic-bezier(0.1, 0.5, 0.1, 1); }

        /* 의미 상세 분석 */
        .meaning-box { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .meaning-item { background: #0f111a; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; }
        .tag { font-size: 0.7rem; color: var(--accent); font-weight: bold; text-transform: uppercase; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align:center; margin-bottom:40px;">
        <h1 style="font-size: 2.2rem; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">AI 문맥 관계도 분석</h1>
        <p style="color:var(--dim); font-size: 0.9rem; margin-top: 5px;">다의어의 정확한 의미와 문장 간의 거리를 측정합니다</p>
    </header>

    <div class="glass-card">
        <input type="text" id="sent1" value="맛있는 배를 깎아서 먹었다">
        <input type="text" id="sent2" value="배가 아파서 병원에 갔다">
        <button id="runBtn" class="btn" disabled>AI 모델 로딩 중...</button>
    </div>

    <div id="resultArea" class="result-area">
        <div class="relation-card">
            <span style="color: var(--dim); font-size: 0.9rem; font-weight: 600;">문맥 관계도 (Semantic Relation)</span>
            <div id="scoreText" class="score-display">0%</div>
            <div class="graph-container"><div id="graphFill" class="graph-fill"></div></div>
            <p id="verdict" style="font-weight: bold; margin-top: 10px;"></p>
        </div>

        <div class="meaning-box">
            <div class="meaning-item">
                <span class="tag">Sentence 1 Meaning</span>
                <div id="sense1" style="font-size: 0.95rem;">의미 분석 중...</div>
            </div>
            <div class="meaning-item">
                <span class="tag">Sentence 2 Meaning</span>
                <div id="sense2" style="font-size: 0.95rem;">의미 분석 중...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let extractor;
    const runBtn = document.getElementById('runBtn');

    async function init() {
        // 문맥 파악에 특화된 다국어 모델 로드
        extractor = await pipeline('feature-extraction', 'Xenova/paraphrase-multilingual-MiniLM-L12-v2');
        runBtn.disabled = false;
        runBtn.textContent = "관계도 분석 실행";
    }

    function cosineSim(a, b) {
        let dot = 0, nA = 0, nB = 0;
        for (let i = 0; i < a.length; i++) { dot += a[i] * b[i]; nA += a[i] * a[i]; nB += b[i] * b[i]; }
        return dot / (Math.sqrt(nA) * Math.sqrt(nB));
    }

    // 단어 주변의 힌트를 찾아 의미를 결정하는 함수
    function analyzeSense(text) {
        const food = ["먹", "맛", "깎", "과일", "후식", "달콤", "즙"];
        const ship = ["타", "항구", "바다", "배 위", "선원", "돛", "갑판"];
        const body = ["아프", "배탈", "복통", "부르", "홀쭉", "병원", "신체"];

        if (food.some(word => text.includes(word))) return "🍎 <b>먹는 과일</b> (음식)";
        if (ship.some(word => text.includes(word))) return "🚢 <b>운송 수단</b> (선박)";
        if (body.some(word => text.includes(word))) return "🧍 <b>사람의 몸</b> (신체 부위)";
        return "❓ <b>기타 문맥</b>";
    }

    runBtn.onclick = async () => {
        const s1 = document.getElementById('sent1').value;
        const s2 = document.getElementById('sent2').value;
        
        runBtn.disabled = true;
        runBtn.textContent = "AI 분석 중...";

        const out1 = await extractor(s1, { pooling: 'mean', normalize: true });
        const out2 = await extractor(s2, { pooling: 'mean', normalize: true });
        
        const sim = cosineSim(out1.data, out2.data);
        const score = (sim * 100).toFixed(1);

        // 결과 표시 업데이트
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('scoreText').textContent = score + "%";
        document.getElementById('graphFill').style.width = score + "%";
        
        // 의미 분석 결과 업데이트
        document.getElementById('sense1').innerHTML = analyzeSense(s1);
        document.getElementById('sense2').innerHTML = analyzeSense(s2);

        const verdict = document.getElementById('verdict');
        if (sim < 0.45) {
            verdict.textContent = "서로 다른 의미로 사용되었습니다.";
            verdict.style.color = "var(--red)";
        } else if (sim < 0.75) {
            verdict.textContent = "문맥상 연관성이 보통입니다.";
            verdict.style.color = "var(--accent)";
        } else {
            verdict.textContent = "같은 의미로 사용된 문맥입니다.";
            verdict.style.color = "var(--green)";
        }

        runBtn.disabled = false;
        runBtn.textContent = "관계도 분석 실행";
    };

    init();
</script>
</body>
</html>
