<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Sentence Distance Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050507; --accent: #00d2ff; --card: #111; }
        body { background: var(--bg); color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 800px; width: 100%; }
        .input-box { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; border: 1px solid #333; color: white; border-radius: 5px; }
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: black; }
        .chart-card { background: var(--card); padding: 20px; border-radius: 15px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>📏 유클리드 거리(Euclidean) 분석</h2>
    <div class="input-box">
        <input type="text" id="s1" value="배가 바다를 건너간다">
        <input type="text" id="s2" value="커다란 선박이 항해를 한다">
        <button id="runBtn" class="btn" disabled>모델 로딩 중...</button>
    </div>

    <div class="chart-card">
        <h4 id="distanceText">거리를 계산해 보세요</h4>
        <canvas id="barChart"></canvas>
    </div>
</div>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let extractor;
    let barChart;

    async function init() {
        extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2');
        document.getElementById('runBtn').disabled = false;
        document.getElementById('runBtn').textContent = "유클리드 거리 측정";
    }

    // 유클리드 거리 계산 함수 (직선 거리)
    function euclideanDistance(a, b) {
        let sum = 0;
        for (let i = 0; i < a.length; i++) {
            sum += Math.pow(a[i] - b[i], 2);
        }
        return Math.sqrt(sum);
    }

    document.getElementById('runBtn').onclick = async () => {
        const out1 = await extractor(document.getElementById('s1').value, { pooling: 'mean', normalize: false });
        const out2 = await extractor(document.getElementById('s2').value, { pooling: 'mean', normalize: false });

        const dist = euclideanDistance(out1.data, out2.data).toFixed(2);
        document.getElementById('distanceText').textContent = `두 문장의 거리: ${dist} (0에 가까울수록 유사함)`;

        updateChart(dist);
    };

    function updateChart(dist) {
        if (barChart) barChart.destroy();
        barChart = new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: ['문장 간 거리'],
                datasets: [{
                    label: 'Euclidean Distance',
                    data: [dist],
                    backgroundColor: '#00d2ff'
                }]
            },
            options: { scales: { y: { beginAtZero: true, max: 20 } } }
        });
    }

    init();
</script>
</body>
</html>
